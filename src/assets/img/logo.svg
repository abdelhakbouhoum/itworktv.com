<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="IT Work TV">
  <!-- IT Work TV wordmark mark: gear + monitor with </> glyph + orbit swoosh.
       Two-tone via the site accent/text tokens; hex fallbacks keep the file
       usable as a standalone <img> (e.g. favicon source). The live header
       copy of this mark lives in src/_includes/partials/header.njk — keep both in sync. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- orbit swoosh (behind the monitor) -->
    <ellipse cx="16" cy="17" rx="13.4" ry="4.8" transform="rotate(-16 16 17)"
             stroke="var(--accent, #0E7490)" stroke-width="1.3" opacity="0.55"/>
    <!-- gear -->
    <g stroke="var(--accent, #0E7490)" stroke-width="1.5">
      <circle cx="8.5" cy="8.5" r="3.4"/>
      <path d="M8.5 4.2v-1.4M8.5 12.8v1.4M4.2 8.5H2.8M12.8 8.5h1.4M5.5 5.5 4.4 4.4M11.5 5.5l1.1-1.1M5.5 11.5l-1.1 1.1M11.5 11.5l1.1 1.1"/>
    </g>
    <circle cx="8.5" cy="8.5" r="1.1" fill="var(--accent, #0E7490)" stroke="none"/>
    <!-- monitor -->
    <rect x="13" y="10" width="15.5" height="11" rx="2.5" fill="var(--accent, #0E7490)" stroke="none"/>
    <g fill="none" stroke="var(--accent-contrast, #FFFFFF)" stroke-width="1.7">
      <polyline points="17.8,13.4 15.2,15.5 17.8,17.6"/>
      <line x1="20.9" y1="13.2" x2="19.4" y2="17.8"/>
      <polyline points="22.6,13.4 25.2,15.5 22.6,17.6"/>
    </g>
    <!-- stand -->
    <g stroke="var(--text, #172435)" stroke-width="1.8">
      <line x1="20.75" y1="21" x2="20.75" y2="23.4"/>
      <line x1="17.4" y1="24.6" x2="24.1" y2="24.6"/>
    </g>
  </g>
</svg>
